{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — ExpenseTracker</title>
  <meta name="description" content="Sign in to your ExpenseTracker account to manage your personal finances." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/style.css' %}" />
</head>
<body>
<div class="auth-page">
  <div class="auth-card animate-in">

    <!-- Header -->
    <div class="auth-header">
      <div class="auth-logo">💰</div>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to your account to continue</p>
    </div>

    <!-- Messages -->
    {% if messages %}
      {% for msg in messages %}
      <div class="alert alert-danger mb-3"
           style="background:rgba(255,107,107,0.1); border:1px solid rgba(255,107,107,0.3); color:#ff8e8e; border-radius:var(--radius-sm); font-size:0.875rem">
        {{ msg }}
      </div>
      {% endfor %}
    {% endif %}

    <!-- Form -->
    <form method="post" action="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label" for="id_username">Username</label>
        <div style="position:relative">
          <ion-icon name="person-outline" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:1rem; pointer-events:none; z-index:1"></ion-icon>
          <input type="text" id="id_username" name="username" class="form-control"
                 placeholder="Enter your username" required autocomplete="username"
                 style="padding-left:38px">
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label" for="id_password">Password</label>
        <div style="position:relative">
          <ion-icon name="lock-closed-outline" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:1rem; pointer-events:none; z-index:1"></ion-icon>
          <input type="password" id="id_password" name="password" class="form-control"
                 placeholder="Enter your password" required autocomplete="current-password"
                 style="padding-left:38px">
          <button type="button" id="toggle-pwd"
                  style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-muted); cursor:pointer; padding:0">
            <ion-icon name="eye-outline"></ion-icon>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary-custom w-100 justify-content-center" style="padding:12px">
        <ion-icon name="log-in-outline"></ion-icon>
        Sign In
      </button>
    </form>

    <hr class="divider" />

    <!-- Test accounts hint -->
    <div style="background:var(--bg-input); border-radius:var(--radius-sm); padding:14px; margin-bottom:16px">
      <div style="font-size:0.72rem; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:8px">Demo Accounts</div>
      <div style="font-size:0.8rem; color:var(--text-secondary)">
        <div class="d-flex justify-content-between mb-1">
          <span><code style="color:var(--accent-light)">testuser</code></span>
          <span style="color:var(--text-muted)">Test@1234</span>
        </div>
        <div class="d-flex justify-content-between">
          <span><code style="color:var(--accent-light)">demo</code></span>
          <span style="color:var(--text-muted)">Demo@1234</span>
        </div>
      </div>
    </div>

    <p style="text-align:center; font-size:0.85rem; color:var(--text-muted); margin:0">
      Don't have an account?
      <a href="{% url 'register' %}" style="color:var(--accent-light); font-weight:600">Create one</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('toggle-pwd').addEventListener('click', function() {
    const input = document.getElementById('id_password');
    const icon = this.querySelector('ion-icon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.setAttribute('name', 'eye-off-outline');
    } else {
      input.type = 'password';
      icon.setAttribute('name', 'eye-outline');
    }
  });
</script>
</body>
</html>
