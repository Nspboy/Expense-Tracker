{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — ExpenseTracker</title>
  <meta name="description" content="Create your free ExpenseTracker account to start tracking expenses and building financial goals." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/style.css' %}" />
</head>
<body>
<div class="auth-page" style="padding: 40px 24px">
  <div class="auth-card animate-in" style="max-width:520px">

    <div class="auth-header">
      <div class="auth-logo">💰</div>
      <h1 class="auth-title">Create your account</h1>
      <p class="auth-subtitle">Start tracking your finances today — it's free</p>
    </div>

    {% if messages %}
      {% for msg in messages %}
      <div class="alert mb-3"
           style="background:rgba(255,107,107,0.1); border:1px solid rgba(255,107,107,0.3); color:#ff8e8e; border-radius:var(--radius-sm); font-size:0.875rem">
        {{ msg }}
      </div>
      {% endfor %}
    {% endif %}

    <form method="post" action="{% url 'register' %}" id="register-form">
      {% csrf_token %}

      <div class="row g-3 mb-3">
        <div class="col-sm-6">
          <label class="form-label" for="id_first_name">First Name</label>
          <input type="text" id="id_first_name" name="first_name" class="form-control"
                 placeholder="Alex" autocomplete="given-name">
        </div>
        <div class="col-sm-6">
          <label class="form-label" for="id_last_name">Last Name</label>
          <input type="text" id="id_last_name" name="last_name" class="form-control"
                 placeholder="Johnson" autocomplete="family-name">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="id_username">Username <span style="color:var(--expense-color)">*</span></label>
        <div style="position:relative">
          <ion-icon name="at-outline" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:1rem; pointer-events:none; z-index:1"></ion-icon>
          <input type="text" id="id_username" name="username" class="form-control"
                 placeholder="Choose a username" required autocomplete="username"
                 style="padding-left:38px">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="id_email">Email Address</label>
        <div style="position:relative">
          <ion-icon name="mail-outline" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:1rem; pointer-events:none; z-index:1"></ion-icon>
          <input type="email" id="id_email" name="email" class="form-control"
                 placeholder="you@example.com" autocomplete="email"
                 style="padding-left:38px">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="id_profession">Profession</label>
        <select id="id_profession" name="profession" class="form-select">
          <option value="Employee">Employee</option>
          <option value="Business">Business Owner</option>
          <option value="Student">Student</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-sm-6">
          <label class="form-label" for="id_password1">Password <span style="color:var(--expense-color)">*</span></label>
          <div style="position:relative">
            <ion-icon name="lock-closed-outline" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:1rem; pointer-events:none; z-index:1"></ion-icon>
            <input type="password" id="id_password1" name="password1" class="form-control"
                   placeholder="Min 8 chars" required
                   style="padding-left:38px" oninput="checkPwd()">
          </div>
        </div>
        <div class="col-sm-6">
          <label class="form-label" for="id_password2">Confirm Password <span style="color:var(--expense-color)">*</span></label>
          <div style="position:relative">
            <ion-icon name="shield-checkmark-outline" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:1rem; pointer-events:none; z-index:1"></ion-icon>
            <input type="password" id="id_password2" name="password2" class="form-control"
                   placeholder="Repeat password" required
                   style="padding-left:38px" oninput="checkPwd()">
          </div>
        </div>
      </div>

      <!-- Password strength bar -->
      <div class="mb-4">
        <div class="progress" style="height:4px">
          <div id="pwd-strength-bar" class="progress-bar" style="width:0%; transition:width 0.3s, background 0.3s"></div>
        </div>
        <div id="pwd-feedback" style="font-size:0.72rem; color:var(--text-muted); margin-top:4px"></div>
      </div>

      <button type="submit" class="btn-primary-custom w-100 justify-content-center" style="padding:12px">
        <ion-icon name="rocket-outline"></ion-icon>
        Create Account
      </button>
    </form>

    <hr class="divider" />

    <p style="text-align:center; font-size:0.85rem; color:var(--text-muted); margin:0">
      Already have an account?
      <a href="{% url 'login' %}" style="color:var(--accent-light); font-weight:600">Sign in</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function checkPwd() {
  const p1 = document.getElementById('id_password1').value;
  const p2 = document.getElementById('id_password2').value;
  const bar = document.getElementById('pwd-strength-bar');
  const fb  = document.getElementById('pwd-feedback');
  let strength = 0;
  if (p1.length >= 8) strength++;
  if (/[A-Z]/.test(p1)) strength++;
  if (/[0-9]/.test(p1)) strength++;
  if (/[^A-Za-z0-9]/.test(p1)) strength++;
  const labels = ['', 'Weak', 'Fair', 'Good', 'Strong'];
  const colors = ['', '#FF6B6B', '#F7B731', '#45B7D1', '#26DE81'];
  bar.style.width = (strength * 25) + '%';
  bar.style.background = colors[strength];
  fb.textContent = strength > 0 ? labels[strength] : '';
  fb.style.color = colors[strength];
  if (p2 && p1 !== p2) {
    fb.textContent = 'Passwords do not match';
    fb.style.color = '#FF6B6B';
  }
}
</script>
</body>
</html>
